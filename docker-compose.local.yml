version: '3.8'

services:

  # ── DB ────────────────────────────────
  db:
    image: mysql:8.0
    env_file:
      - ./.env.local
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: