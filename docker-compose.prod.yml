version: '3.8'

services:

  # ── DB ────────────────────────────────
  db:
    image: mysql:8.0
    env_file:
      - ./.env.prod
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── BE ────────────────────────────────
  be:
    build: ./BE
    env_file:
      - ./BE/.env.prod
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── FE ────────────────────────────────
  fe:
    build: ./FE
    env_file:
      - ./FE/.env.prod
    expose:
      - "80"
    volumes:
      - /home/ubuntu/app/models/sixdrepnet360/6drepnet360.onnx:/usr/share/nginx/html/models/sixdrepnet360/6drepnet360.onnx
    depends_on:
      - be
    restart: unless-stopped

  # ── Nginx ─────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./INF/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - be
      - fe
    restart: unless-stopped

  # ── AI (추후 RAG 도입 시 활성화) ──────
  ai:
    build: ./AI
    env_file:
      - ./AI/.env.prod
    expose:
      - "8001"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: