[project]
name = "my-project-ai"
version = "0.1.0"
description = "AI API server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
# 6DRepNet360 PyTorch 체크포인트를 ONNX 로 1회 변환할 때만 사용 (브라우저 추론용 자산 생성).
# 운영 서버에는 설치하지 않는다. 실행 예: uv run --group export python AI/scripts/export_6drepnet360_onnx.py ...
export = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "onnxscript>=0.1.0",
    "numpy>=2.0.0",
    # 캘리브레이션 face crop 을 HuggingFace 에서 streaming 으로 가져오기 위해 사용
    # (download_hf_calibration.py). quantize/compare 자체는 datasets 의존 없음.
    "datasets>=2.20.0",
    # 자가 캡처 (capture_calibration_frames.py) — 웹캠 access + face crop preview.
    # 측면 (yaw |60°+|) bin 보강용. 일반 face dataset 에는 측면이 거의 없음.
    "opencv-python>=4.10.0",
    # Pexels API 호출 (download_pexels_calibration.py). datasets 의 transitive 로도 들어오지만
    # 직접 사용처가 있으니 명시.
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
