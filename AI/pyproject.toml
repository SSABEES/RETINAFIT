[project]
name = "my-project-ai"
version = "0.1.0"
description = "AI API server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
# 6DRepNet360 PyTorch 체크포인트를 ONNX 로 1회 변환할 때만 사용 (브라우저 추론용 자산 생성).
# 운영 서버에는 설치하지 않는다. 실행 예: uv run --group export python AI/scripts/export_6drepnet360_onnx.py ...
export = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "onnxscript>=0.1.0",
    "numpy>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
