events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    client_max_body_size 10M;

    # ── HTTP → HTTPS 리다이렉트 ────────────
    server {
        listen 80;
        server_name k14s107.p.ssafy.io;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name k14s107.p.ssafy.io;

        ssl_certificate     /etc/letsencrypt/live/k14s107.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/k14s107.p.ssafy.io/privkey.pem;

        # ── crossOriginIsolated 활성화 (multi-thread WASM 조건) ──────────
        # SharedArrayBuffer 가용 → onnxruntime-web 이 numThreads>1 로 동작 → 추론 ~4× 가속.
        # credentialless 는 vite dev 설정과 동일 — cross-origin 자원(S3 이미지 등)을 credential
        # 없이 로드해 require-corp 의 CORP 강제 없이 격리 조건 충족.
        # location 블록에 자체 add_header 가 있으면 inheritance 가 끊기므로 필요 시 location
        # 블록에서도 동일 헤더를 다시 선언해야 함 (현재 .onnx 는 sub-resource 라 불필요).
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;

        # ── ONNX 모델 캐시 (1년) ──────────
        location ~* \.onnx$ {
            proxy_pass http://fe:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /health {
                    proxy_pass http://be:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

        location /api/ {
            proxy_pass http://be:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://fe:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}