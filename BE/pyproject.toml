[project]
name = "my-project-be"
version = "0.1.0"
description = "Backend API server"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "boto3>=1.42.96",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "rsa>=4.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
